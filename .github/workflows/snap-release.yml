name: Build & Release Desktop (Ubuntu Snap, Linux DEB/RPM/AppImage, Windows, macOS)

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build-ubuntu-snap:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Snapcraft
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 net.ipv6.conf.default.disable_ipv6=1 || true
          sudo systemctl start snapd.socket snapd || true
          sudo snap wait system seed.loaded || true
          for attempt in 1 2 3 4; do
            if sudo snap install snapcraft --classic; then
              exit 0
            fi
            delay=$((attempt * 10))
            echo "snap install snapcraft failed (attempt $attempt), retrying in ${delay}s..."
            sleep $delay
          done
          exit 1

      - name: Build Snap with Snapcraft (destructive-mode on ubuntu-24.04)
        working-directory: desktop
        run: sudo snapcraft pack --destructive-mode

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-snap
          path: desktop/*.snap

  build-linux-packages:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux GTK & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg rpm desktop-file-utils libfuse2t64

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test & Build Linux Release
        working-directory: desktop
        run: |
          flutter pub get
          flutter test
          flutter build linux --release

      - name: Package .tar.gz, .deb, .rpm, and .AppImage
        run: |
          VERSION=$(grep '^version:' desktop/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BUNDLE="desktop/build/linux/x64/release/bundle"
          mkdir -p out

          # 1. Portable tar.gz
          tar -czf "out/daily-bread-bible-${VERSION}-linux-x64.tar.gz" -C "$BUNDLE" .

          # 2. Debian / Ubuntu / Mint (.deb)
          DEB_DIR="pkg_deb"
          mkdir -p "$DEB_DIR/DEBIAN" \
                   "$DEB_DIR/opt/daily-bread-bible" \
                   "$DEB_DIR/usr/bin" \
                   "$DEB_DIR/usr/share/applications" \
                   "$DEB_DIR/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE"/* "$DEB_DIR/opt/daily-bread-bible/"
          ln -s /opt/daily-bread-bible/daily_bread "$DEB_DIR/usr/bin/daily-bread-bible"
          cp desktop/assets/icon.png "$DEB_DIR/usr/share/icons/hicolor/512x512/apps/daily-bread-bible.png"
          cat > "$DEB_DIR/usr/share/applications/daily-bread-bible.desktop" <<'EOF'
          [Desktop Entry]
          Name=Daily Bread
          Comment=Offline Bible & Study Notes
          Exec=daily-bread-bible
          Icon=daily-bread-bible
          Terminal=false
          Type=Application
          Categories=Education;Literature;
          StartupWMClass=com.dailybread.daily_bread
          EOF
          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: daily-bread-bible
          Version: ${VERSION}
          Section: education
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libstdc++6
          Maintainer: SitholeWB <https://github.com/SitholeWB/daily-bread-bible>
          Description: Daily Bread Offline Bible & Study Notes
           Offline-first Bible reading and study app with 60 translations,
           cross-references, study notes, and scheduled scripture notifications.
          EOF
          dpkg-deb --build "$DEB_DIR" "out/daily-bread-bible_${VERSION}_amd64.deb"

          # 3. Fedora / RHEL / openSUSE (.rpm)
          RPM_ROOT="$HOME/rpmbuild"
          mkdir -p "$RPM_ROOT"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > "$RPM_ROOT/SPECS/daily-bread-bible.spec" <<EOF
          Name:           daily-bread-bible
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        Daily Bread Offline Bible & Study Notes
          License:        MIT
          BuildArch:      x86_64
          AutoReqProv:    no

          %description
          Offline-first Bible reading and study app with 60 translations,
          cross-references, study notes, and scheduled scripture notifications.

          %install
          mkdir -p %{buildroot}/opt/daily-bread-bible
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/512x512/apps
          cp -r $GITHUB_WORKSPACE/pkg_deb/opt/daily-bread-bible/* %{buildroot}/opt/daily-bread-bible/
          ln -s /opt/daily-bread-bible/daily_bread %{buildroot}/usr/bin/daily-bread-bible
          cp $GITHUB_WORKSPACE/desktop/assets/icon.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/daily-bread-bible.png
          cp $GITHUB_WORKSPACE/pkg_deb/usr/share/applications/daily-bread-bible.desktop %{buildroot}/usr/share/applications/daily-bread-bible.desktop

          %files
          /opt/daily-bread-bible
          /usr/bin/daily-bread-bible
          /usr/share/applications/daily-bread-bible.desktop
          /usr/share/icons/hicolor/512x512/apps/daily-bread-bible.png
          EOF
          rpmbuild -bb "$RPM_ROOT/SPECS/daily-bread-bible.spec"
          cp "$RPM_ROOT"/RPMS/x86_64/*.rpm "out/daily-bread-bible-${VERSION}-1.x86_64.rpm"

          # 4. Universal AppImage (Arch, Fedora, Debian, openSUSE, etc.)
          APPDIR="DailyBread.AppDir"
          mkdir -p "$APPDIR/opt/daily-bread-bible" \
                   "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp -r "$BUNDLE"/* "$APPDIR/opt/daily-bread-bible/"
          cp desktop/assets/icon.png "$APPDIR/daily-bread-bible.png"
          cp desktop/assets/icon.png "$APPDIR/.DirIcon"
          cp "$DEB_DIR/usr/share/applications/daily-bread-bible.desktop" "$APPDIR/daily-bread-bible.desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/opt/daily-bread-bible/daily_bread" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run "$APPDIR" "out/daily-bread-bible-${VERSION}-x86_64.AppImage"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: out/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows Release
        working-directory: desktop
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "../daily-bread-bible-windows-x64.zip" -Force

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: daily-bread-bible-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build macOS Release & DMG
        working-directory: desktop
        run: |
          flutter pub get
          flutter build macos --release
          mkdir -p dmg_staging
          cp -R build/macos/Build/Products/Release/daily_bread.app "dmg_staging/Daily Bread.app"
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Daily Bread" -srcfolder dmg_staging -ov -format UDZO ../daily-bread-bible-macos.dmg

      - name: Upload macOS dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: daily-bread-bible-macos.dmg

  release:
    needs: [build-ubuntu-snap, build-linux-packages, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/ubuntu-snap/*.snap
            release-artifacts/linux-packages/*
            release-artifacts/windows-zip/*.zip
            release-artifacts/macos-dmg/*.dmg
